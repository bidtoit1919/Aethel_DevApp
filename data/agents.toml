# Agent definitions for Aethel's Launch (SPEC 3.4).
#
# Adding an agent means adding one table here; agents.py has no per-agent code.
#
# Fields:
#   name       display name
#   command    executable looked up on PATH
#   args       argument list
#   env        environment variables (strings)
#   json_args  flag = TOML table; the table is passed as one JSON argument
#   json_env   variable = TOML table; the table is set as one JSON string
#
#   prompt_args  how to hand the agent an opening prompt (${prompt})
#   transcripts  transcript format Aethel can read after a session:
#                "claude", "codex" or "opencode"
#   init_before / init_after
#                headless run of the agent's own /init: the command is
#                command + init_before + args + init_after
#   init_prompt  file under data/prompts used as ${init_prompt}
#   memory_file  the file /init writes, reported in the ledger
#   install      install command from the agent's own README
#   docs         where the endpoint recipe comes from
#   verified     true once the recipe was run against OmniRoute here
#
# Placeholders, usable in any string, including table keys:
#   ${model}     the chosen model id, exactly as the router lists it
#   ${base_url}  the router base URL, e.g. http://localhost:20128/v1
#   ${root_url}  the same URL without a trailing /v1
#   ${prompt}    the opening prompt built from the Context tab
#
# Each entry was checked on 2026-10-31 by running a one-line prompt through
# OmniRoute 3.8.49 with the exact command below.

[claude-code]
name = "Claude Code"
command = "claude"
# Source: https://code.claude.com/docs/en/model-config ("--model" flag) and
# https://code.claude.com/docs/en/settings ("--settings" sits above user,
# project and local settings files). The base URL goes through --settings
# rather than the environment because an "env" block in
# ~/.claude/settings.json overrides shell variables
# (https://code.claude.com/docs/en/llm-gateway-connect). ANTHROPIC_BASE_URL
# takes the root URL; Claude Code appends /v1/messages itself. The haiku and
# subagent variables keep background tasks on the chosen model, since the
# router does not know Claude Code's built-in model names
# (https://code.claude.com/docs/en/model-config, "Environment variables").
args = ["--model", "${model}"]
# `claude "query"` starts an interactive session with that first message.
prompt_args = ["${prompt}"]
transcripts = "claude"
# `claude -p /init` was run here and wrote CLAUDE.md (2026-11-01).
init_after = ["-p", "/init", "--permission-mode", "acceptEdits"]
memory_file = "CLAUDE.md"
install = "curl -fsSL https://claude.ai/install.sh | bash"
docs = "https://code.claude.com/docs/en/llm-gateway-connect"
verified = true

[claude-code.json_args."--settings".env]
ANTHROPIC_BASE_URL = "${root_url}"
ANTHROPIC_DEFAULT_HAIKU_MODEL = "${model}"
CLAUDE_CODE_SUBAGENT_MODEL = "${model}"

[codex]
name = "Codex CLI"
command = "codex"
# Source: https://developers.openai.com/codex/config-advanced ("Custom model
# providers": model_provider, model_providers.<id>.base_url, wire_api) and
# `codex --help` for -c/--config and -m/--model. Overrides go on the command
# line because project-level .codex/config.toml may not set model_providers.
# No env_key, so no credential is sent; OmniRoute serves /v1/responses.
args = [
    "-c", 'model_provider="aethel"',
    "-c", 'model_providers.aethel.name="Aethel router"',
    "-c", 'model_providers.aethel.base_url="${base_url}"',
    "-c", 'model_providers.aethel.wire_api="responses"',
    "-m", "${model}",
]
# `codex --help`: "[PROMPT] Optional user prompt to start the session".
prompt_args = ["${prompt}"]
transcripts = "codex"
# `codex exec` does not run slash commands, so the headless /init passes
# the prompt Codex's own /init uses (codex-rs/tui/assets/
# prompt_for_init_command.md, Apache-2.0). It only creates AGENTS.md when
# missing, matching Codex's behaviour.
init_before = ["exec", "--sandbox", "workspace-write"]
init_after = ["${init_prompt}"]
init_prompt = "codex-init.md"
memory_file = "AGENTS.md"
install = "npm install -g @openai/codex"
docs = "https://developers.openai.com/codex/config-advanced"
verified = true

[opencode]
name = "opencode"
command = "opencode"
# Source: https://opencode.ai/docs/config (OPENCODE_CONFIG_CONTENT: inline
# config, applied above global and project files) and
# https://opencode.ai/docs/providers ("@ai-sdk/openai-compatible" with
# options.baseURL and a models map). `opencode --help` documents -m in the
# form provider/model. Nothing is written to disk.
args = ["-m", "aethel/${model}"]
prompt_args = ["--prompt", "${prompt}"]
transcripts = "opencode"
# `opencode run --command init` was run here and wrote AGENTS.md.
init_before = ["run", "--command", "init"]
memory_file = "AGENTS.md"
install = "curl -fsSL https://opencode.ai/v2/install | bash"
docs = "https://opencode.ai/docs/providers"
verified = true

[opencode.json_env.OPENCODE_CONFIG_CONTENT.provider.aethel]
npm = "@ai-sdk/openai-compatible"
name = "Aethel router"
options = { baseURL = "${base_url}" }
models = { "${model}" = { name = "${model}" } }

# The entries below come from each project's own documentation or source.
# They are not installed on the development machine, so verified = false
# until someone runs them against OmniRoute; the Agent Hub says so.
# OPENAI_API_KEY is a placeholder: OmniRoute needs no key, but these
# clients refuse to start without one. It is not a secret.

[hermes]
name = "Hermes Agent"
command = "hermes"
# Source: NousResearch/hermes-agent hermes_cli/runtime_provider_backends.py
# (base_url precedence: explicit > CUSTOM_BASE_URL > config.yaml, for
# provider "custom") and hermes_cli/_parser.py (-m/--model, --provider,
# -q/--query: "On a real TTY the prompt seeds an interactive session").
args = ["--provider", "custom", "-m", "${model}"]
env = { CUSTOM_BASE_URL = "${base_url}" }
prompt_args = ["-q", "${prompt}"]
install = "curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash"
docs = "https://hermes-agent.nousresearch.com/docs/getting-started/installation"
verified = false

[aider]
name = "Aider"
command = "aider"
# Source: aider/website/docs/llms/openai-compat.md (OPENAI_API_BASE,
# OPENAI_API_KEY, --model openai/<model-name>). Aider has no option that
# seeds an interactive session, so context cannot be handed over.
args = ["--model", "openai/${model}"]
env = { OPENAI_API_BASE = "${base_url}", OPENAI_API_KEY = "aethel-local" }
install = "python -m pip install aider-install && aider-install"
docs = "https://aider.chat/docs/llms/openai-compat.html"
verified = false

[qwen-code]
name = "Qwen Code"
command = "qwen"
# Source: QwenLM/qwen-code docs/users/configuration/auth.md (OpenAI-
# compatible auth from OPENAI_API_KEY, OPENAI_BASE_URL, OPENAI_MODEL) and
# packages/cli/src/cli.ts (-i/--prompt-interactive).
env = { OPENAI_BASE_URL = "${base_url}", OPENAI_MODEL = "${model}", OPENAI_API_KEY = "aethel-local" }
prompt_args = ["-i", "${prompt}"]
install = "npm install -g @qwen-code/qwen-code@latest"
docs = "https://github.com/QwenLM/qwen-code/blob/main/docs/users/configuration/auth.md"
verified = false

[goose]
name = "Goose"
command = "goose"
# Source: aaif-goose/goose documentation/docs/getting-started/providers.md
# (OpenAI provider: OPENAI_HOST is the proxy root, OPENAI_BASE_PATH the
# path it serves; GOOSE_PROVIDER and GOOSE_MODEL select it).
args = ["session"]
env = { GOOSE_PROVIDER = "openai", GOOSE_MODEL = "${model}", OPENAI_HOST = "${root_url}", OPENAI_BASE_PATH = "v1/chat/completions", OPENAI_API_KEY = "aethel-local" }
install = "curl -fsSL https://github.com/aaif-goose/goose/releases/download/stable/download_cli.sh | bash"
docs = "https://goose-docs.ai/docs/getting-started/providers"
verified = false
